<title>Skill Ladder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#15232A">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mobile-first. Rank card + ring grid up top, ladders below; tabs live in a bottom bar on phones and a top bar on desktop. Detail opens as a bottom sheet on phones, a docked panel on desktop. */
:root {
  --bg: #E6EAE8;
  --surface: #F8F9F7;
  --raised: #FFFFFF;
  --ink: #15232A;
  --muted: #5A6970;
  --line: #C8CFCC;
  --hero: #15232A;       /* dark rank card, both themes */
  --hero-ink: #EEF2F0;
  --accent: #2153D0;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE4F8;
  --good: #23784B;
  --good-soft: #D8EDE0;
  --danger: #B4372B;
  --push: #E05A14; --pull: #2153D0; --core: #8A3CD6; --legs: #23874A; --balance: #C98A00;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --navh: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1518; --surface: #162026; --raised: #1C282F; --ink: #E5EBE8; --muted: #93A2A7; --line: #2A373D;
  --hero: #1E2D35; --hero-ink: #EEF2F0;
  --accent: #6F96FF; --accent-ink: #0C1420; --accent-soft: #1F2C4A; --good: #5FC38C; --good-soft: #17301F; --danger: #E2665A;
  --push: #FF8A4C; --pull: #6F96FF; --core: #B784F5; --legs: #5CC584; --balance: #F2BD3A;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1518; --surface: #162026; --raised: #1C282F; --ink: #E5EBE8; --muted: #93A2A7; --line: #2A373D;
  --hero: #1E2D35; --hero-ink: #EEF2F0;
  --accent: #6F96FF; --accent-ink: #0C1420; --accent-soft: #1F2C4A; --good: #5FC38C; --good-soft: #17301F; --danger: #E2665A;
  --push: #FF8A4C; --pull: #6F96FF; --core: #B784F5; --legs: #5CC584; --balance: #F2BD3A;
  color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.g-Push { --g: var(--push); } .g-Pull { --g: var(--pull); } .g-Core { --g: var(--core); } .g-Legs { --g: var(--legs); } .g-Balance { --g: var(--balance); }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 16px calc(var(--navh) + 40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 760px) { .wrap { padding-block: 24px 80px; } }

/* Rank card */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 18px; padding: 18px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: auto -40px -60px auto; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.10), transparent 70%); pointer-events: none; }
.hero-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.hero h1 { font-family: var(--display); font-weight: 900; font-size: clamp(2.2rem, 9vw, 3.4rem); line-height: .85; margin: 0; text-transform: uppercase; letter-spacing: .01em; }
.sync { font-size: .72rem; opacity: .7; text-align: right; }
.rank { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.badge { width: 62px; height: 62px; display: grid; place-items: center; position: relative; }
.badge svg { position: absolute; inset: 0; }
.badge b { font-family: var(--display); font-weight: 900; font-size: 1.6rem; position: relative; }
.rank-name { font-family: var(--display); font-weight: 800; font-size: 1.6rem; text-transform: uppercase; line-height: 1; }
.rank-sub { font-size: .8rem; opacity: .75; font-variant-numeric: tabular-nums; }
.xpbar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; margin-top: 8px; }
.xpbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--push), var(--balance), var(--legs), var(--pull), var(--core)); transition: width .6s; }
.hstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; border-top: 1px solid rgba(255,255,255,.12); padding-top: 12px; }
.hstat b { display: block; font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.hstat span { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; opacity: .7; }

/* Tabs: top on desktop, bottom bar on phones */
.tabs { display: flex; }
.tab { background: none; border: 0; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--ink); }
@media (max-width: 759px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--raised); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    box-shadow: 0 -4px 20px rgba(0,0,0,.08); }
  .tab { flex: 1; flex-direction: column; gap: 2px; font-size: .7rem; padding: 6px 0; min-height: 52px; justify-content: center; border-radius: 12px; }
  .tab[aria-selected="true"] { color: var(--accent); }
  .tab[aria-selected="true"] svg { transform: translateY(-1px); }
}
@media (min-width: 760px) {
  .tabs { gap: 4px; margin: 22px 0 18px; border-bottom: 1px solid var(--line); }
  .tab { padding: 10px 14px; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { border-bottom-color: var(--accent); }
  .tab svg { width: 18px; height: 18px; }
}
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 0 10px; }
.section-h h2 { font-family: var(--display); font-weight: 800; font-size: 1.4rem; text-transform: uppercase; margin: 0; letter-spacing: .02em; }
.section-h span { font-size: .8rem; color: var(--muted); }
@media (min-width: 760px) { .section-h:first-child { margin-top: 0; } }

/* Ring grid */
.rings { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
@media (max-width: 420px) { .rings { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } }
.ring { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px 8px; display: grid; justify-items: center; gap: 4px; text-align: center; transition: transform .15s, border-color .15s; }
.ring:hover { transform: translateY(-2px); border-color: var(--g); }
.ring .rg { width: 72px; height: 72px; position: relative; }
.ring .rg > svg { position: absolute; inset: 0; }
.ring .fig { position: absolute; inset: 14px; }
.ring .nm { font-size: .74rem; font-weight: 600; line-height: 1.15; }
.ring .ct { font-family: var(--mono); font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.ring.complete { background: color-mix(in srgb, var(--g) 12%, var(--surface)); border-color: var(--g); }

.chips { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .85rem; white-space: nowrap; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--g); margin-right: 6px; vertical-align: 1px; }

.layout { display: grid; gap: 24px; align-items: start; }
@media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr) 370px; } }

/* Ladders */
.lanes { display: grid; gap: 12px; min-width: 0; }
.lane { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 0 4px; min-width: 0; position: relative; overflow: hidden; }
.lane::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--g); }
.lane-h { display: flex; align-items: center; gap: 10px; padding: 0 14px 0 16px; }
.lane-h .lf { width: 40px; height: 40px; flex: none; border-radius: 10px; background: color-mix(in srgb, var(--g) 14%, transparent); padding: 4px; }
.lane-h h3 { font-family: var(--display); font-weight: 800; font-size: 1.35rem; text-transform: uppercase; margin: 0; letter-spacing: .02em; line-height: 1; }
.tag { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: var(--g); font-weight: 700; }
.count { margin-left: auto; text-align: right; font-family: var(--mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mini { width: 70px; height: 5px; border-radius: 9px; background: var(--line); overflow: hidden; margin-top: 4px; margin-left: auto; }
.mini i { display: block; height: 100%; background: var(--g); }
.prereq { font-size: .76rem; color: var(--muted); padding: 6px 16px 0; }
.rail-scroll { overflow-x: auto; padding: 12px 10px 10px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.rail { list-style: none; margin: 0; padding: 0; display: flex; position: relative; width: max-content; }
.rail li { position: relative; scroll-snap-align: start; }
.rail li + li::before { content: ""; position: absolute; top: 19px; right: calc(50% + 19px); width: calc(100% - 38px); height: 3px; border-radius: 3px; background: var(--line); }
.rail li.done + li::before { background: var(--g); }
.node { display: grid; justify-items: center; gap: 6px; width: 92px; background: none; border: 0; padding: 0 4px; border-radius: 8px; }
.dot { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: .82rem; font-weight: 500;
  border: 2px solid var(--line); background: var(--raised); color: var(--muted); transition: transform .15s; }
.node .nm { font-size: .74rem; line-height: 1.25; text-align: center; color: var(--muted); }
li.done .dot { background: var(--g); border-color: var(--g); color: #fff; }
li.done .nm { color: var(--ink); }
li.cur .dot { background: var(--raised); border: 3px solid var(--g); color: var(--g); font-weight: 700; position: relative; }
li.cur .nm { color: var(--ink); font-weight: 700; }
/* the current step pulses with a ring that only grows and fades, which the GPU animates without repainting the page */
li.cur .dot::before, .tn.cur .tdot::before { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 3px solid var(--g);
  opacity: 0; pointer-events: none; animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: .5; } 60%, 100% { transform: scale(1.45); opacity: 0; } }
.node:hover .dot { transform: scale(1.08); }
.node.sel .dot { outline: 2px solid var(--ink); outline-offset: 3px; }

/* Detail panel / sheet */
.scrim { position: fixed; inset: 0; background: rgba(8,14,18,.45); z-index: 40; animation: fade .2s; }
@media (min-width: 1000px) { .scrim { display: none; } }
@keyframes fade { from { opacity: 0; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: grid; gap: 14px; min-width: 0; overflow: hidden; }
.panel-band { background: color-mix(in srgb, var(--g) 16%, var(--surface)); padding: 16px 18px 12px; display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 10px; align-items: end; position: relative; }
.panel-band .fig { width: 96px; height: 96px; }
.panel-body { padding: 0 18px 18px; display: grid; gap: 14px; }
.eyebrow { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--g); font-weight: 700; }
.panel h2 { font-family: var(--display); font-weight: 900; font-size: 2.1rem; line-height: .95; margin: 4px 0 8px; text-transform: uppercase; text-wrap: balance; }
.close { position: absolute; top: 10px; right: 10px; border: 0; background: var(--raised); border-radius: 50%; width: 36px; height: 36px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.handle { display: none; }
@media (min-width: 1000px) { .panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } .close { display: none; } }
@media (max-width: 999px) {
  .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; border-radius: 22px 22px 0 0; max-height: 86vh; overflow-y: auto; border: 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,.25); animation: up .28s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .panel-band { padding-top: 22px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .panel-body { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .handle { display: block; position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 4px; background: var(--muted); opacity: .4; }
  .close { top: 16px; }
}
@keyframes up { from { transform: translateY(100%); } }
.status { display: inline-block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 4px; }
.status.done { background: var(--good-soft); color: var(--good); }
.status.cur { background: var(--g); color: #fff; }
.status.todo { background: var(--bg); color: var(--muted); }
.target { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.target b { font-family: var(--display); font-weight: 900; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.target span { font-size: .8rem; color: var(--muted); line-height: 1.3; }
.cues { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.cues li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.cues li::before { content: counter(c); counter-increment: c; width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, var(--g) 18%, transparent); color: var(--g);
  font-size: .72rem; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.cues { counter-reset: c; }
.best { font-size: .85rem; color: var(--muted); }
.best b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.h4 { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0; font-weight: 600; }
.spark { width: 100%; height: 46px; display: block; }

.logform { display: grid; gap: 10px; }
.sets { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.sets label { display: grid; gap: 3px; font-size: .64rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.sets input { width: 66px; height: 44px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); font-family: var(--mono); font-size: 1rem; font-variant-numeric: tabular-nums; }
.sets input:focus { border-color: var(--g, var(--accent)); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--g, var(--accent)) 25%, transparent); }
.qfill { display: flex; flex-wrap: wrap; gap: 6px; }
.qfill .chip { font-size: .78rem; min-height: 32px; padding: 4px 12px; }
.addset { border: 1px dashed var(--line); background: none; border-radius: 10px; width: 44px; height: 44px; color: var(--muted); font-size: 1.2rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 0 16px; min-height: 44px; font-weight: 700; font-size: .92rem; }
.btn.alt { background: none; color: var(--ink); border-color: var(--line); }
.btn.go { background: var(--g); border-color: var(--g); color: #fff; }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.note { font-size: .82rem; color: var(--muted); margin: 0; }
.note.ok { color: var(--good); font-weight: 600; }

/* Today */
.timer { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; background: var(--hero); color: var(--hero-ink); border-radius: 16px; padding: 12px 16px; margin-bottom: 14px;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 10; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.timer .face { display: flex; align-items: center; gap: 12px; }
.timer .tring { width: 46px; height: 46px; }
.timer .clock { font-family: var(--mono); font-size: 1.8rem; font-variant-numeric: tabular-nums; min-width: 4.5ch; line-height: 1; }
.timer .lbl { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
.timer .row button { background: none; border: 1px solid rgba(255,255,255,.35); color: inherit; border-radius: 8px; padding: 0 10px; min-height: 36px; font-size: .82rem; }
.timer .row button.on { background: var(--hero-ink); color: var(--hero); border-color: var(--hero-ink); }
.today-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 12px; align-content: start; min-width: 0; position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--g); }
.card-h { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.card-h .fig { width: 52px; height: 52px; border-radius: 12px; background: color-mix(in srgb, var(--g) 14%, transparent); padding: 5px; }
.card h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.35rem; text-transform: uppercase; line-height: 1.05; }
.card .sub { font-size: .78rem; color: var(--muted); }
.linkbtn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; min-height: 34px; color: var(--g); font-size: .8rem; font-weight: 700; }
.donecard { display: grid; place-items: center; text-align: center; gap: 6px; min-height: 140px; }

/* Log */
.log { display: grid; gap: 18px; max-width: 780px; }
.heat-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; overflow-x: auto; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); gap: 3px; width: max-content; }
.heat i { width: 13px; height: 13px; border-radius: 3px; background: var(--line); opacity: .55; }
.heat i.l1 { background: var(--legs); opacity: .35; } .heat i.l2 { background: var(--legs); opacity: .6; } .heat i.l3 { background: var(--legs); opacity: .85; } .heat i.l4 { background: var(--legs); opacity: 1; }
.heat i.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.heat-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: .76rem; color: var(--muted); flex-wrap: wrap; }
.day h3 { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 6px; font-weight: 700; }
.logbtns { display: flex; gap: 2px; }
.vals.tapedit { border: 0; background: none; padding: 6px 8px; margin: -6px -8px; border-radius: 8px; color: inherit; font: inherit; font-family: var(--mono); font-size: .84rem; cursor: text; }
.vals.tapedit.hit { color: var(--good); }
.vals.tapedit:hover { background: var(--bg); }
.vals.edit { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.vals.edit input { width: 52px; height: 36px; padding: 0 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); font-family: var(--mono); }
.entry { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.entry .bar { width: 6px; align-self: stretch; border-radius: 3px; background: var(--g); }
.entry .what b { display: block; line-height: 1.25; }
.entry .what span { font-size: .78rem; color: var(--muted); }
.entry .vals { font-family: var(--mono); font-size: .84rem; font-variant-numeric: tabular-nums; text-align: right; }
.entry .hit { color: var(--good); }
.x { background: none; border: 0; color: var(--muted); font-size: .78rem; padding: 0 8px; min-height: 36px; border-radius: 6px; }
.x.arm { color: #fff; background: var(--danger); }
.empty { padding: 28px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; }
.backup { display: grid; gap: 10px; margin-top: 18px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.backup-h { display: grid; gap: 2px; }
.backup-in { display: grid; gap: 8px; }
.backup-text { width: 100%; min-height: 84px; resize: vertical; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); font-family: var(--mono); font-size: .72rem; word-break: break-all; }
.note.bad { color: var(--danger); font-weight: 600; }
.danger { margin-top: 12px; padding-top: 16px; border-top: 1px solid var(--line); }

/* Mastery celebration */
.party { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; pointer-events: none; padding: 24px; }
.party-card { background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 22px 26px; text-align: center; display: grid; gap: 6px; justify-items: center;
  animation: pop .5s cubic-bezier(.2,1.4,.4,1); box-shadow: 0 20px 60px rgba(0,0,0,.35); max-width: 320px; }
.party-card .fig { width: 92px; height: 92px; }
.party-card .k { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.party-card b { font-family: var(--display); font-weight: 900; font-size: 2rem; line-height: .95; text-transform: uppercase; }
.party-card .xp { font-family: var(--mono); color: var(--balance); font-weight: 500; }
.party i { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 2px; animation: burst 1.1s ease-out forwards; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@keyframes burst { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
.party.out { animation: fade .3s reverse forwards; }

/* Skill tree map */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 14px; min-height: 34px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tree-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 18px; min-width: 0; -webkit-overflow-scrolling: touch;
  background: radial-gradient(circle, color-mix(in srgb, var(--muted) 28%, transparent) 1px, transparent 1.6px) 0 0 / 20px 20px, var(--surface); }
.tree-scroll { touch-action: pan-x pan-y; position: relative; overflow: auto; height: min(74vh, 780px); overscroll-behavior: contain; cursor: grab; }
.tree-scroll.dragging { cursor: grabbing; user-select: none; }
.tree-scroll.dragging .tn { pointer-events: none; }
/* a fixed scrollbar gutter keeps the map's width the same at every zoom, so it never shifts when the zoom is applied */
.tree-scroll { contain: content; scrollbar-gutter: stable; }
/* while zooming the map is one GPU layer that is only scaled; it's redrawn sharp when the gesture ends */
.tree-scroll.zooming .tree { will-change: transform; }
.tree-scroll.zooming .tn { pointer-events: none; }
.tree-scroll.zooming .tdot::before { animation-play-state: paused; }
.tree-sizer { position: relative; margin: 0 auto; }
.tree { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.zoombar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.zoombar button { min-width: 38px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 1.1rem; font-weight: 600; line-height: 1; }
.zoombar button.zt { font-size: .8rem; padding: 0 12px; }
.zoombar #zoom-pct { font-family: var(--mono); font-size: .8rem; min-width: 4ch; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.tree .edges { position: absolute; inset: 0; overflow: visible; }
.edges path, .edges line { fill: none; stroke: var(--line); stroke-width: 3; stroke-dasharray: 2 7; stroke-linecap: round; }
.edges .on { stroke: var(--g); stroke-width: 5; stroke-dasharray: none; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--g) 55%, transparent)); }
.edges .spark { fill: var(--g); stroke: none; }
.edges .dim, .tree .dim { opacity: .18; }
.tgroup { position: absolute; top: 12px; text-align: center; font-size: .66rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--g);
  padding-bottom: 5px; border-bottom: 2px solid var(--g); }
.thub { position: absolute; width: 74px; height: 74px; border-radius: 50%; transform: translate(-50%, -50%); display: grid; place-content: center; text-align: center;
  background: var(--hero); color: var(--hero-ink); box-shadow: 0 0 0 5px var(--surface), 0 0 0 7px var(--balance), 0 8px 24px rgba(0,0,0,.25); }
.thub b { font-family: var(--display); font-weight: 900; font-size: 1.15rem; text-transform: uppercase; line-height: 1; }
.thub span { font-size: .58rem; letter-spacing: .08em; text-transform: uppercase; opacity: .8; margin-top: 2px; }
.tlabel { position: absolute; transform: translateX(-50%); text-align: center; font-family: var(--display); font-weight: 800; font-size: .98rem; line-height: 1;
  text-transform: uppercase; color: var(--g); white-space: nowrap; background: var(--surface); padding: 3px 8px; border-radius: 8px; }
.tlabel span { display: block; font-family: var(--mono); font-weight: 500; font-size: .66rem; color: var(--muted); margin-top: 3px; }
.tn { position: absolute; width: 84px; transform: translate(-50%, -24px); display: grid; justify-items: center; gap: 5px; background: none; border: 0; padding: 0; z-index: 1; }
.tdot { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: .86rem; font-weight: 600;
  background: var(--raised); color: var(--muted); border: 2px solid var(--line); transition: transform .15s; position: relative; }
.tnm { font-size: .68rem; line-height: 1.2; text-align: center; color: var(--muted); max-width: 84px; background: var(--surface); border-radius: 4px; padding: 0 2px; }
.tn:hover .tdot { transform: scale(1.08); }
.tn.done .tdot { background: var(--g); border-color: var(--g); color: #fff; box-shadow: 0 0 12px color-mix(in srgb, var(--g) 45%, transparent); }
.tn.done .tnm { color: var(--ink); }
.tn.cur .tdot { border: 3px solid var(--g); color: var(--g); }
.tn.cur .tnm { color: var(--ink); font-weight: 700; }
.tn.locked .tdot { border-style: dashed; }
.tn.final .tdot { width: 56px; height: 56px; border-radius: 16px; transform: rotate(45deg); }
.tn.final .tdot > span { transform: rotate(-45deg); }
.tn.final { transform: translate(-50%, -28px); }
.tn.final:hover .tdot { transform: rotate(45deg) scale(1.08); }
.tn.final.todo .tdot { color: var(--g); border-color: color-mix(in srgb, var(--g) 55%, var(--line)); }
.tn.final .tnm { font-weight: 700; color: var(--ink); }
.tn.ready .tdot::after { content: "★"; position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--good); color: #fff;
  font-size: 11px; display: grid; place-items: center; font-family: var(--body); }
.tn.final.ready .tdot::after { transform: rotate(-45deg); }
.tn.sel .tdot { outline: 2px solid var(--ink); outline-offset: 4px; }
.tree .tn.dim { pointer-events: none; }
.tree-tip { margin-top: 8px; }
.edges .band { fill: transparent; stroke: none; }
.edges .band.alt { fill: color-mix(in srgb, var(--muted) 7%, transparent); }
.edges .tierline { stroke: color-mix(in srgb, var(--muted) 45%, transparent); stroke-width: 1.5; stroke-dasharray: 6 6; }
.tlv { position: absolute; left: 8px; transform: translateY(-50%); width: 58px; display: grid; gap: 2px; }
.tlv b { font-size: .6rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); line-height: 1.1; }
.tlv span { font-family: var(--mono); font-size: .66rem; color: var(--muted); }
.status.lvl { background: var(--bg); color: var(--ink); }
.eta { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 14px; border-radius: 12px;
  background: color-mix(in srgb, var(--g) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--g) 25%, var(--line)); }
.eta svg { color: var(--g); margin-top: 2px; }
.eta b { display: block; font-size: .95rem; }
.eta span { display: block; font-size: .78rem; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.eta-mini { display: flex; align-items: center; gap: 6px; }
.eta-mini svg { color: var(--g); flex: none; width: 14px; height: 14px; }
.tree-tip-desk { margin-top: 8px; display: none; }
@media (hover: hover) and (pointer: fine) { .tree-tip { display: none; } .tree-tip-desk { display: block; } }

/* Training plan */
#routine { flex-wrap: wrap; }
.plan-banner { flex-basis: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; margin-bottom: 4px;
  border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: .86rem; }
.plan-banner .linkbtn { color: var(--accent); white-space: nowrap; }
.plan-setup { display: grid; gap: 22px; max-width: 900px; }
.ps-step { display: grid; gap: 10px; }
.ps-step .h4 { font-size: .8rem; color: var(--ink); }
.goal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 132px), 1fr)); gap: 8px; }
.goal { position: relative; display: grid; justify-items: center; gap: 4px; padding: 12px 8px 10px; text-align: center; border-radius: 14px;
  background: var(--surface); border: 2px solid var(--line); transition: border-color .15s, transform .15s; }
.goal:hover { transform: translateY(-2px); }
.goal .fig { width: 54px; height: 54px; }
.goal b { font-size: .84rem; line-height: 1.2; }
.goal span { font-size: .7rem; color: var(--muted); }
.goal:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.goal.on { border-color: var(--g); background: color-mix(in srgb, var(--g) 12%, var(--surface)); }
.goal-n { position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: var(--g); color: #fff !important; font-size: .74rem !important; font-weight: 700; }
.daypick { display: flex; gap: 6px; flex-wrap: wrap; }
.daypick button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 700; color: var(--muted); }
.daypick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.plan-view { display: grid; gap: 16px; max-width: 760px; }
.goal-cards { display: grid; gap: 10px; }
.goal-card { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 16px;
  background: color-mix(in srgb, var(--g) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--g) 35%, var(--line)); }
.goal-card .fig { width: 64px; height: 64px; }
.gc-body { display: grid; gap: 6px; min-width: 0; }
.gc-body h3 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 1.6rem; line-height: 1; text-transform: uppercase; }
.gc-body .note svg { vertical-align: -3px; color: var(--g); }
.week { display: grid; gap: 8px; }
.week-h, .session-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.session-h h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.3rem; text-transform: uppercase; }
.wstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 2px; padding: 8px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.wd span { font-weight: 700; font-size: .85rem; }
.wd i { font-style: normal; font-family: var(--mono); font-size: .7rem; }
.wd.on { color: var(--ink); background: var(--raised); }
.wd.on i::after { content: " ex"; }
.wd.today { box-shadow: inset 0 0 0 2px var(--balance); }
.wd.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.wd:disabled { opacity: .5; cursor: default; }
.session { display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.warm { padding: 8px 10px; border-radius: 10px; background: var(--bg); }
.prows { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--raised);
  border-left: 4px solid var(--g); }
.prow .fig { width: 46px; height: 46px; }
.prow-body { display: grid; gap: 2px; min-width: 0; }
.prow-body b { font-size: .95rem; }
.prow-body .swap { font-style: italic; }
.prow .btn.start { min-height: 40px; width: 44px; justify-content: center; padding: 0; }
.pwhy { justify-self: start; font-size: .64rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--bg); color: var(--muted); }
.pwhy.k-goal { background: var(--g); color: #fff; }
.pwhy.k-unlock { background: color-mix(in srgb, var(--g) 25%, var(--bg)); color: var(--ink); }
.pwhy.k-support { color: var(--g); }

/* Mastery check */
.mastery { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; background: var(--raised); }
.m-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.m-pill { font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.m-pill.ready { background: var(--good); color: #fff; }
.m-pill.done { background: var(--good-soft); color: var(--good); }
.m-req { margin: 0; font-size: .95rem; line-height: 1.4; }
.m-req b { color: var(--g); }
.m-bars { display: grid; gap: 6px; }
.m-bar { position: relative; height: 30px; border-radius: 8px; background: var(--bg); overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: .78rem; }
.m-bar i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--g) 30%, transparent); border-radius: 8px; transition: width .5s; }
.m-bar.hit i { background: color-mix(in srgb, var(--good) 35%, transparent); }
.m-bar span, .m-bar b { position: relative; }
.m-bar span { color: var(--muted); }
.m-bar b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }

.m-mini { display: grid; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.m-mini-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: .82rem; }
.m-mini-top span b { font-weight: 600; }
.m-mini-top span b b { color: var(--g); }
.m-pct { font-family: var(--mono); font-size: .82rem; white-space: nowrap; }
.m-mini.ready .m-pct { color: var(--good); }
.m-track { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.m-track i { display: block; height: 100%; background: var(--g); border-radius: 6px; transition: width .5s; }
.m-mini.ready .m-track i { background: var(--good); }
li.ready .dot { position: relative; }
li.ready .dot::after { content: "★"; position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; border-radius: 50%; background: var(--good); color: #fff;
  font-size: 10px; display: grid; place-items: center; font-family: var(--body); }

/* Guided exercise mode: one deliberately dark, full-screen look tinted by the muscle group */
.focus { position: fixed; inset: 0; z-index: 90; color: #F2F5F3; color-scheme: dark;
  background: radial-gradient(130% 75% at 50% 0%, color-mix(in srgb, var(--g) 60%, #0B1216), #0B1216 72%);
  display: grid; grid-template-rows: auto 1fr; align-content: start; gap: 10px; overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(18px, env(safe-area-inset-left, 0px)); }
.focus.enter { animation: fade .25s; }
.f-inner { width: 100%; max-width: 520px; margin: 0 auto; display: grid; gap: 14px; justify-items: center; align-content: center; text-align: center; }
.f-top { width: 100%; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px; position: relative; }
.f-x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: inherit; font-size: 1.05rem; flex: none; }

.f-eyebrow { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; opacity: .75; text-align: left; line-height: 1.3; }
.f-cuebtn { margin-left: auto; flex: none; border: 1px solid rgba(255,255,255,.35); background: none; color: inherit; border-radius: 99px; padding: 0 12px; min-height: 34px; font-size: .78rem; font-weight: 700; }
.f-cuebtn[aria-expanded="true"] { background: #F2F5F3; color: #0B1216; border-color: #F2F5F3; }
.f-cuebox { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 2; background: rgba(11,18,22,.97); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 12px 14px; box-shadow: 0 12px 30px rgba(0,0,0,.4); text-align: left; }
.f-cuebox p { margin: 0 0 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; opacity: .75; font-weight: 600; }
.f-cuebox ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: .92rem; line-height: 1.35; }
.f-setlbl { flex: none; font-family: var(--mono); font-size: .85rem; background: rgba(255,255,255,.12); padding: 6px 12px; border-radius: 99px; white-space: nowrap; }
.f-name { font-family: var(--display); font-weight: 900; font-size: clamp(2.2rem, 10vw, 3.4rem); line-height: .9; text-transform: uppercase; margin: 0; text-wrap: balance; }
.f-fig { --g: #F2F5F3; --muted: #F2F5F3; width: min(44vw, 190px); height: min(44vw, 190px); }
.f-fig.still { animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.04); } }
.f-ring { position: relative; width: min(66vw, 270px); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border: 0; background: none; color: inherit; padding: 0; border-radius: 50%; }
.f-ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.f-num { position: relative; display: grid; justify-items: center; line-height: 1; }
.f-num b { font-family: var(--display); font-weight: 900; font-size: clamp(4.6rem, 24vw, 7.4rem); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.f-num span { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; opacity: .75; margin-top: 4px; }
.f-hint { font-size: .82rem; opacity: .7; margin: 0; }
.f-tapzone { width: 100%; border: 0; background: rgba(255,255,255,.04); color: inherit; border-radius: 24px; padding: 14px 10px 12px; display: grid; justify-items: center; gap: 10px;

.f-quick { display: grid; gap: 8px; justify-items: center; width: 100%; }
.f-quick > span { font-size: .75rem; opacity: .7; text-transform: uppercase; letter-spacing: .08em; }

.f-sets { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.f-sets i { font-style: normal; min-width: 44px; height: 32px; padding: 0 10px; border-radius: 99px; display: grid; place-items: center; font-family: var(--mono); font-size: .85rem;
  border: 2px solid rgba(255,255,255,.25); color: rgba(255,255,255,.55); }
.f-sets button { font: inherit; min-width: 44px; height: 32px; padding: 0 10px; border-radius: 99px; display: grid; place-items: center; font-family: var(--mono); font-size: .85rem;

.f-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 3; }

@keyframes sheet-out { to { transform: translate(-50%, 115%); opacity: 0; } }
.f-sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px + var(--host-badge, 0px)); z-index: 4;
  width: min(440px, calc(100vw - 24px)); background: #121C21; border: 1px solid rgba(255,255,255,.15); border-radius: 22px; padding: 18px; display: grid; gap: 12px;
  text-align: center; box-shadow: 0 -10px 40px rgba(0,0,0,.45); }
.f-sheet h3 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 1.7rem; text-transform: uppercase; line-height: 1; }
.sh-k { margin: 0; font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
.sh-num { display: flex; align-items: center; justify-content: center; gap: 22px; }
.sh-num b { font-family: var(--display); font-weight: 900; font-size: 4rem; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2.5ch; display: grid; }
.sh-num small { font-family: var(--body); font-size: .75rem; font-weight: 600; opacity: .7; }
.sh-note { margin: 0; font-size: .85rem; opacity: .8; }
.sh-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.sh-del { border: 0; background: none; color: #FF8A80; font-weight: 700; min-height: 40px; }
.f-sets i.d { background: #F2F5F3; border-color: #F2F5F3; color: #0B1216; font-weight: 600; }
